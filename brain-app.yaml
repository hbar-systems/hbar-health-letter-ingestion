# hbar.health — Eingangspost (letter ingestion) — brain-app manifest
#
# The letter-reading app: upload an incoming PDF letter (Entlassbrief,
# Verlegungsbrief, Arztbrief) -> structured clinical summary. The counterpart
# to the Arztbrief app — that one WRITES letters, this one READS them.
# App #2 of the hbar.health demo.
#
# Converted from the standalone FastAPI module in this repo. PDF text is
# extracted client-side with pdf.js; scanned PDFs are read with on-device OCR
# (tesseract.js — WASM, bundled, no CDN). The summary + translation are
# generated through the `llm.complete` bridge intent (Route A) on the
# operator's BYOK model. No Python backend, no server.
#
# Installs into a brain via Settings -> Apps (paste this repo's public GitHub
# URL -> Approve).
#
# Schema: registry/schema/brain/app.schema.json (in hbar.world)
# Created: 2026-05-18 · OCR added: 2026-05-18

dialect: brain-app/v1
id: hbar-health-letter-ingestion
name: Eingangspost
version: 0.3.1
description: Liest einen eingehenden Brief (PDF-Upload oder eingefügter Text) und erstellt eine strukturierte klinische Zusammenfassung. Auf Wunsch ein Antwortschreiben-Entwurf. Nur Entwurf; ärztliche Prüfung erforderlich.
license: AGPL-3.0

author:
  name: hbar
  url: https://hbar.systems
  contact: hello@hbar.systems

repo: https://github.com/hbar-systems/hbar-health-letter-ingestion

tab:
  label: Eingangspost
  route: /eingangspost
  order: 31

entries:
  ui_bundle: dist/

# The app asks the brain to summarize and translate via the `llm.complete`
# bridge intent. That intent RAG-retrieves over the layers declared below, so
# the reading can draw on the practice corpus — Leitlinien, prior letters,
# protocols.
permissions:
  - llm.invoke

requires_layers:
  - layer: semantic
    mode: read

requires_endpoints:
  - POST /chat/rag

engines:
  brainfoundry-nous: ">=0.8.4"
